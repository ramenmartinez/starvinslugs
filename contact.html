<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — StarvinSlugs</title>
  <meta name="description" content="Email, call, or text StarvinSlugs, or request something for the menu.">
  <meta name="theme-color" content="#fff8ee">
  <link rel="icon" href="logo.png?v=2">
  <link rel="apple-touch-icon" href="logo.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="contact">
<main>

  <section class="wrap section contact-top">
    <div>
      <h1>Contact us</h1>
      <p>Not on social media? No problem. Questions or anything else, just email us.</p>
      <div class="email-row">
        <a class="btn" data-email>Email us</a>
        <strong data-fill="SITE.email"></strong>
      </div>
      <p style="margin-top:14px">Or call or text: <a data-tel style="font-weight:700;color:var(--ink)" data-fill="SITE.phone"></a></p>
    </div>

    <div class="form-card">
      <h2>What should we sell next?</h2>
      <form id="request-form" novalidate>
        <fieldset>
          <legend>Type</legend>
          <label class="radio"><input type="radio" name="kind" value="Food" checked> Food</label>
          <label class="radio"><input type="radio" name="kind" value="Drink"> Drink</label>
        </fieldset>
        <label class="field" for="what">What would you like to see?
          <input id="what" name="what" type="text" placeholder="e.g. Mango Celsius">
        </label>
        <label class="field" for="allergies">Allergies or food restrictions (optional)
          <input id="allergies" name="allergies" type="text" placeholder="e.g. vegetarian, nut allergy, halal">
        </label>
        <div class="form-msg" role="status"></div>
        <button class="btn" type="submit" style="align-self:flex-start">Send request</button>
      </form>
    </div>
  </section>

  <section class="wrap" style="padding-bottom:64px">
    <h2 class="h2" style="margin-bottom:24px">Common questions</h2>
    <div class="faq" id="faq"></div>
  </section>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
