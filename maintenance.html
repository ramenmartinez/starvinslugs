<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarvinSlugs — Be right back</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FAFAF6">
  <link rel="icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --navy: #011a8a; --yellow: #fde65c; --bg: #fafaf6; --muted: #565a70; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--navy);
      font-family: "DM Sans", system-ui, sans-serif;
      text-align: center;
    }
    main { max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    img { width: 88px; height: 88px; border-radius: 50%; }
    h1 {
      margin: 0;
      font-family: "Anton", Impact, sans-serif;
      font-weight: 400;
      font-size: clamp(36px, 8vw, 56px);
      line-height: 1.1;
      text-transform: uppercase;
    }
    h1 span { background: var(--navy); color: var(--yellow); padding: 0 8px; }
    p { margin: 0; font-size: 17px; line-height: 1.6; color: var(--muted); }
    a {
      display: inline-flex;
      align-items: center;
      height: 44px;
      padding: 0 20px;
      border-radius: 999px;
      background: var(--navy);
      color: #fff;
      font-weight: 500;
      text-decoration: none;
    }
    a:hover { background: #01136a; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="StarvinSlugs logo">
    <h1>Be right <span>back.</span></h1>
    <p>We're making some updates to the site. In the meantime, follow us on Instagram for menus and pop-up times.</p>
    <a href="https://www.instagram.com/starvinslugs/" target="_blank" rel="noopener noreferrer">@starvinslugs</a>
  </main>
</body>
</html>
