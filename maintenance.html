<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarvinSlugs — Be right back</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFF8EE">
  <link rel="icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Colors taken from the logo: red bag background, yellow slug, dark red outline */
    :root {
      --red: #e2434a;
      --red-dark: #a8161c;
      --button: #c42d35;
      --button-hover: #a8161c;
      --yellow: #f9d343;
      --bg: #fff8ee;
      --muted: #6b3a3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--red-dark);
      font-family: "DM Sans", system-ui, sans-serif;
      text-align: center;
    }
    main { max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    img { width: 132px; height: 132px; border-radius: 50%; object-fit: cover; border: 4px solid var(--yellow); }
    h1 {
      margin: 0;
      font-family: "Anton", Impact, sans-serif;
      font-weight: 400;
      font-size: clamp(36px, 8vw, 56px);
      line-height: 1.1;
      text-transform: uppercase;
    }
    h1 span { background: var(--yellow); color: var(--red-dark); padding: 0 8px; }
    p { margin: 0; font-size: 17px; line-height: 1.6; color: var(--muted); }
    a {
      display: inline-flex;
      align-items: center;
      height: 44px;
      padding: 0 20px;
      border-radius: 999px;
      background: var(--button);
      color: #fff;
      font-weight: 500;
      text-decoration: none;
    }
    a:hover { background: var(--button-hover); }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="StarvinSlugs logo">
    <h1>Be right <span>back.</span></h1>
    <p>We're making some updates to the site. In the meantime, follow us on Instagram for menus and pop-up times.</p>
    <a href="https://www.instagram.com/starvinslugs/" target="_blank" rel="noopener noreferrer">@starvinslugs</a>
  </main>
  <script>
    // Show a clean address (starvinslugs.com) instead of /maintenance.html?utm_...
    if (location.pathname !== "/" || location.search) {
      history.replaceState(null, "", "/");
    }
  </script>
</body>
</html>
