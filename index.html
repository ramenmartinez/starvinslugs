<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarvinSlugs — Snacks and drinks, right where you are</title>
  <meta name="description" content="Student-run snack stand selling food and drinks between classes.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="logo.png?v=3">
  <link rel="apple-touch-icon" href="logo.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">
<main>

  <section class="wrap hero">
    <div>
      <h1>Snacks and drinks, <mark>right where you are.</mark></h1>
      <p>Cheap snacks and drinks, served right between classes.</p>
      <a class="btn" href="menu.html">See this week's menu</a>
    </div>
    <div data-photo="homeHero" data-label="Photo: team serving at the stand"></div>
  </section>

  <section class="band">
    <div class="wrap">
      <div>
        <div class="label">Next pop-up</div>
        <div class="big" data-fill="NEXT_POPUP.location"></div>
        <div data-fill="NEXT_POPUP.time"></div>
      </div>
      <div>
        <p data-fill="NEXT_POPUP.howToSpot"></p>
        <p style="color:#e9cdf4;margin-top:8px">Walk up, order, and pay with <span data-fill="SITE.payment"></span>.</p>
      </div>
      <div data-photo="map" data-label="Map of the spot"></div>
    </div>
  </section>

  <section class="wrap section">
    <div class="row-head"><h2 class="h2" id="home-menu-title">On the menu this week</h2><a class="link" href="menu.html">Full menu →</a></div>
    <div class="tiles" id="home-menu"></div>
  </section>

  <section class="wrap section" style="padding-top:0">
    <div class="row-head"><h2 class="h2">Recent pop-ups</h2><a class="link" href="about.html">See all on About →</a></div>
    <div class="popups3" id="home-popups"></div>
  </section>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
