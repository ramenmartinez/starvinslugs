<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu — StarvinSlugs</title>
  <meta name="description" content="This week's StarvinSlugs menu.">
  <meta name="theme-color" content="#fff8ee">
  <link rel="icon" href="logo.png?v=2">
  <link rel="apple-touch-icon" href="logo.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="menu">
<main>

  <section class="wrap section" style="padding-bottom:32px">
    <div class="menu-head">
      <div>
        <h1>This week's menu</h1>
        <p class="muted" style="margin-top:6px">Updated <span data-fill="MENU_UPDATED"></span> · Menu changes each pop-up</p>
      </div>
      <div class="chip">
        <div><span class="label">Where</span><b data-fill="NEXT_POPUP.location"></b></div>
        <div><span class="label">When</span><b data-fill="NEXT_POPUP.time"></b></div>
      </div>
    </div>
  </section>

  <section class="wrap menu-cols" style="padding-bottom:40px">
    <div>
      <h2 class="h2" style="font-size:24px;margin-bottom:16px">Food</h2>
      <div class="stack" id="menu-food"></div>
    </div>
    <div>
      <h2 class="h2" style="font-size:24px;margin-bottom:16px">Drinks</h2>
      <div class="stack" id="menu-drinks"></div>
    </div>
  </section>

  <section class="wrap" style="padding-bottom:64px">
    <p style="border-top:1.5px solid var(--line);padding-top:22px">Have an idea for the menu? <a class="link" href="contact.html">Request an item →</a></p>
  </section>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
